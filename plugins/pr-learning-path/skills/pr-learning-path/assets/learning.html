<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PR Learning Path</title>
  <style>
    :root {
      --background: #fafaf9;
      --foreground: #1c1917;
      --card: #ffffff;
      --card-foreground: #1c1917;
      --muted: #f5f5f4;
      --muted-foreground: #6b6963;
      --border: #e7e5e4;
      --primary: #0f766e;
      --primary-hover: #0d655f;
      --primary-foreground: #f0fdfa;
      --primary-soft: #ccfbf1;
      --brand-warm: #f28c28;
      --brand-warm-soft: #ffedd5;
      --success: #197143;
      --success-soft: #e2f4e8;
      --destructive: #a43a34;
      --destructive-soft: #fbe7e4;
      --ring: #0f8b8d;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(28, 25, 23, .05), 0 1px 3px rgba(28, 25, 23, .08);
    }
    :root[data-theme="dark"] {
      --background: #0a0a0a;
      --foreground: #fafaf9;
      --card: #171717;
      --card-foreground: #fafaf9;
      --muted: #262626;
      --muted-foreground: #a3a3a3;
      --border: #2e2e2e;
      --primary: #5eead4;
      --primary-hover: #99f6e4;
      --primary-foreground: #042f2e;
      --primary-soft: #123c38;
      --brand-warm: #fb923c;
      --brand-warm-soft: #431407;
      --success: #86efac;
      --success-soft: #163c25;
      --destructive: #fca5a5;
      --destructive-soft: #461c1c;
      --ring: #2dd4bf;
      --shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --background: #0a0a0a;
        --foreground: #fafaf9;
        --card: #171717;
        --card-foreground: #fafaf9;
        --muted: #262626;
        --muted-foreground: #a3a3a3;
        --border: #2e2e2e;
        --primary: #5eead4;
        --primary-hover: #99f6e4;
        --primary-foreground: #042f2e;
        --primary-soft: #123c38;
        --brand-warm: #fb923c;
        --brand-warm-soft: #431407;
        --success: #86efac;
        --success-soft: #163c25;
        --destructive: #fca5a5;
        --destructive-soft: #461c1c;
        --ring: #2dd4bf;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    button { appearance: none; -webkit-appearance: none; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(20px, 4vw, 56px);
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--background) 88%, transparent);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; }
    .brand-mark svg { display: block; width: 100%; height: 100%; }
    .brand-copy { display: grid; gap: 1px; }
    .brand strong { letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; }
    .eyebrow { color: var(--muted-foreground); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; }
    .actions { display: flex; gap: 8px; }
    #theme { min-width: 76px; }
    .button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--card-foreground);
      padding: 0 14px;
      font-weight: 550;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .button:hover { border-color: var(--primary); background: var(--primary-soft); }
    .button.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); font-weight: 650; }
    .button.primary:hover { background: var(--primary-hover); }
    .button:disabled { cursor: not-allowed; opacity: .42; }
    .shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 820px);
      gap: clamp(24px, 5vw, 72px);
      max-width: 1220px;
      margin: 0 auto;
      padding: clamp(28px, 5vw, 64px) clamp(20px, 4vw, 56px) 80px;
    }
    aside { position: sticky; top: 96px; align-self: start; }
    .source-project { margin-top: 8px; color: var(--muted-foreground); font-size: .88rem; font-weight: 650; overflow-wrap: anywhere; }
    .source-title { margin: 2px 0 4px; font-size: 1.15rem; line-height: 1.3; }
    .source-link { color: var(--primary); overflow-wrap: anywhere; text-underline-offset: 3px; }
    .progress-track { height: 7px; background: var(--muted); border-radius: 999px; overflow: hidden; margin: 24px 0 8px; }
    .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary) 0 calc(100% - 4px), var(--brand-warm) calc(100% - 4px)); transition: width .2s ease; }
    .progress-copy { color: var(--muted-foreground); font-size: .88rem; }
    .stage-nav { display: grid; gap: 8px; margin-top: 24px; }
    .stage-button {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: center;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px;
      text-align: left;
      color: var(--muted-foreground);
      background: transparent;
      cursor: pointer;
    }
    .stage-button[aria-current="step"] { color: var(--foreground); background: var(--card); border-color: var(--border); box-shadow: var(--shadow); }
    .stage-number { width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 50%; display: grid; place-items: center; font-size: .78rem; }
    .stage-button.complete .stage-number { color: var(--success); border-color: var(--success); }
    main { min-width: 0; }
    .section-head h1 { font-size: clamp(2rem, 5vw, 3.8rem); line-height: 1.04; letter-spacing: -.05em; margin: 8px 0 14px; }
    .section-meta { color: var(--muted-foreground); }
    .notice, .card {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 6px);
      box-shadow: var(--shadow);
    }
    .notice { padding: 18px 20px; margin: 20px 0; }
    .objectives { margin: 28px 0; padding: 20px 24px; }
    .objectives h2 { margin: 0 0 12px; font-size: .92rem; letter-spacing: .06em; text-transform: uppercase; }
    .objective-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .objective-item { display: grid; grid-template-columns: 22px 1fr; gap: 9px; color: var(--muted-foreground); }
    .objective-item.current { color: var(--foreground); font-weight: 650; }
    .objective-status { font-size: .86rem; padding-top: 1px; }
    .question { padding: clamp(22px, 4vw, 36px); }
    .question-top { display: flex; justify-content: space-between; gap: 20px; color: var(--muted-foreground); font-size: .88rem; }
    .question h2 { font-size: clamp(1.25rem, 2.7vw, 1.75rem); line-height: 1.3; margin: 16px 0 24px; }
    .options { display: grid; gap: 10px; }
    .option {
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 12px;
      align-items: start;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      background: var(--card);
      color: var(--card-foreground);
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }
    .option:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
    .option:disabled { cursor: default; opacity: .72; }
    .option.selected.correct { border-color: var(--success); background: var(--success-soft); opacity: 1; }
    .option.selected.wrong { border-color: var(--destructive); background: var(--destructive-soft); opacity: 1; }
    .key { border: 1px solid var(--border); border-radius: calc(var(--radius) - 3px); width: 26px; height: 26px; display: grid; place-items: center; font-size: .78rem; }
    .feedback { margin-top: 18px; border-radius: 12px; padding: 16px 18px; }
    .feedback.correct { background: var(--success-soft); color: var(--success); }
    .feedback.wrong { background: var(--destructive-soft); color: var(--destructive); }
    .expected { margin-top: 14px; color: var(--foreground); }
    .source-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; min-width: 0; }
    .source-links strong { flex-basis: 100%; color: var(--foreground); }
    .source-links a { max-width: 100%; min-width: 0; overflow-wrap: anywhere; color: var(--primary); border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px; text-decoration: none; background: var(--card); }
    .question-actions, .pager { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .pager { justify-content: space-between; }
    .completion { margin-top: 22px; padding: 18px; background: var(--primary-soft); border-radius: calc(var(--radius) + 2px); }
    .skip { max-width: 760px; margin: 12vh auto; padding: 28px; }
    .skip h1 { margin-top: 8px; }
    .hidden { display: none !important; }
    @media (max-width: 760px) {
      .topbar { position: static; align-items: flex-start; }
      .brand { align-items: center; }
      .shell { grid-template-columns: 1fr; padding-top: 28px; }
      aside { position: static; }
      .stage-nav { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .section-head h1 { font-size: 2.35rem; }
    }
    @media (max-width: 480px) {
      .topbar { align-items: center; padding: 16px 20px; }
      .brand .eyebrow { display: none; }
      .button { padding: 0 12px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">__BRAND_ICON__</span>
      <span class="brand-copy"><strong>PR Learning Path</strong><span class="eyebrow">Learn the change</span></span>
    </div>
    <div class="actions">
      <button class="button" id="theme" type="button" aria-label="Color theme: System. Change to Light">System</button>
      <button class="button" id="reset" type="button">Reset</button>
    </div>
  </header>
  <div id="app"></div>
  <script id="learning-data" type="application/json">__LEARNING_DATA__</script>
  <script>
    (() => {
      "use strict";
      const data = JSON.parse(document.getElementById("learning-data").textContent);
      const app = document.getElementById("app");
      const memoryStore = new Map();
      const source = data.source;
      const sourceIdentity = source.url || JSON.stringify(source.identity);
      const storagePrefix = `pr-learning-path:v1:${source.mode}:${sourceIdentity}:`;
      const revisionPrefix = `${storagePrefix}revision:`;
      const storageKey = `${revisionPrefix}${source.revision}`;
      let storageAvailable = true;

      function storageGet(key) {
        if (storageAvailable) {
          try { return localStorage.getItem(key); }
          catch (_) { storageAvailable = false; }
        }
        return memoryStore.get(key) || null;
      }

      function storageSet(key, value) {
        memoryStore.set(key, value);
        if (storageAvailable) {
          try { localStorage.setItem(key, value); }
          catch (_) { storageAvailable = false; }
        }
      }

      function storageRemove(key) {
        memoryStore.delete(key);
        if (storageAvailable) {
          try { localStorage.removeItem(key); }
          catch (_) { storageAvailable = false; }
        }
      }

      function removeStaleRevisions() {
        if (!storageAvailable) return;
        try {
          for (let index = localStorage.length - 1; index >= 0; index -= 1) {
            const key = localStorage.key(index);
            if (key && key.startsWith(revisionPrefix) && key !== storageKey) localStorage.removeItem(key);
          }
        } catch (_) { storageAvailable = false; }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[character]);
      }

      const githubProject = source.mode === "github" && source.identity?.owner && source.identity?.repo
        ? `${source.identity.owner}/${source.identity.repo}`
        : "";
      const projectMarkup = githubProject ? `<div class="source-project">${escapeHtml(githubProject)}</div>` : "";

      const themeOrder = ["system", "light", "dark"];
      const themeButton = document.getElementById("theme");

      function themeName(theme) {
        return `${theme[0].toUpperCase()}${theme.slice(1)}`;
      }

      function setTheme(theme) {
        if (theme === "system") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.dataset.theme = theme;
        storageSet(`${storagePrefix}theme`, theme);
        const nextTheme = themeOrder[(themeOrder.indexOf(theme) + 1) % themeOrder.length];
        themeButton.textContent = themeName(theme);
        themeButton.setAttribute("aria-label", `Color theme: ${themeName(theme)}. Change to ${themeName(nextTheme)}`);
      }

      let theme = storageGet(`${storagePrefix}theme`) || "system";
      setTheme(theme);
      themeButton.addEventListener("click", () => {
        theme = themeOrder[(themeOrder.indexOf(theme) + 1) % themeOrder.length];
        setTheme(theme);
      });

      if (data.skip) {
        app.innerHTML = `<main class="skip card"><div class="eyebrow">No questions needed</div>${projectMarkup}<h1>${escapeHtml(source.title)}</h1><p>${escapeHtml(data.skip.message)}</p>${source.url ? `<a class="source-link" href="${escapeHtml(source.url)}">${source.mode === "github" ? "Open GitHub PR" : "Open source change"}</a>` : ""}</main>`;
        document.getElementById("reset").classList.add("hidden");
        return;
      }

      removeStaleRevisions();
      const defaultState = {stageIndex: 0, questionByStage: {}, answers: {}};
      let state = defaultState;
      try {
        const stored = storageGet(storageKey);
        if (stored) state = {...defaultState, ...JSON.parse(stored)};
      } catch (_) { state = defaultState; }

      function save() { storageSet(storageKey, JSON.stringify(state)); }
      function stageQuestionIndex(stageIndex) { return state.questionByStage[stageIndex] || 0; }
      function status(question) {
        const answer = state.answers[question.id];
        if (!answer) return "Not answered";
        if (answer.correct) return answer.attempts > 1 ? "Answered correctly after retry" : "Answered correctly";
        return "Needs review";
      }
      function answeredCount() { return Object.keys(state.answers).length; }
      function allQuestions() { return data.stages.flatMap(stage => stage.questions); }
      function stageComplete(stage) { return stage.questions.every(question => state.answers[question.id]); }
      function notice(kind) {
        return data.coverageNotices.some(item => item.kind === kind)
          ? `<div class="notice"><strong>${kind === "problem" ? "Problem questions not included" : "Impact questions not included"}</strong><br>${kind === "problem" ? "There was not enough clear information to make two useful questions about the problem." : "There was not enough clear information to make two useful questions about the effects of this change."}</div>`
          : "";
      }

      function selectOption(question, optionIndex) {
        const option = question.options[optionIndex];
        if (!option) return;
        const previous = state.answers[question.id];
        if (previous && previous.correct) return;
        const attempts = (previous?.attempts || 0) + 1;
        state.answers[question.id] = {
          selectedOptionId: option.id,
          attempts,
          correct: option.id === question.correctOptionId,
          continued: false
        };
        save();
        render();
        document.querySelector(".feedback")?.focus();
      }

      function retry(question) {
        const previous = state.answers[question.id];
        if (!previous || previous.correct) return;
        previous.selectedOptionId = null;
        save();
        render();
        document.querySelector(".option")?.focus();
      }

      function moveQuestion(delta, continueAnyway = false) {
        const stage = data.stages[state.stageIndex];
        const current = stageQuestionIndex(state.stageIndex);
        const question = stage.questions[current];
        if (continueAnyway && state.answers[question.id]) state.answers[question.id].continued = true;
        const next = current + delta;
        if (next >= 0 && next < stage.questions.length) {
          state.questionByStage[state.stageIndex] = next;
        } else if (delta > 0 && state.stageIndex < data.stages.length - 1) {
          state.stageIndex += 1;
        } else if (delta < 0 && state.stageIndex > 0) {
          state.stageIndex -= 1;
          state.questionByStage[state.stageIndex] = data.stages[state.stageIndex].questions.length - 1;
        }
        save();
        render();
        document.querySelector("main h1")?.focus();
      }

      function render() {
        const stage = data.stages[state.stageIndex];
        const questionIndex = Math.min(stageQuestionIndex(state.stageIndex), stage.questions.length - 1);
        state.questionByStage[state.stageIndex] = questionIndex;
        const question = stage.questions[questionIndex];
        const answer = state.answers[question.id];
        const selected = question.options.find(option => option.id === answer?.selectedOptionId);
        const complete = answeredCount();
        const total = allQuestions().length;
        const progress = Math.round((complete / total) * 100);
        const stageButtons = data.stages.map((item, index) => `
          <button class="stage-button ${stageComplete(item) ? "complete" : ""}" data-stage-index="${index}" ${index === state.stageIndex ? 'aria-current="step"' : ""}>
            <span class="stage-number">${stageComplete(item) ? "✓" : index + 1}</span><span>${escapeHtml(item.title)}</span>
          </button>`).join("");
        const objectives = stage.objectives.map((objective, index) => {
          const objectiveQuestion = stage.questions.find(item => item.objectiveId === objective.id);
          const objectiveStatus = status(objectiveQuestion);
          return `<li class="objective-item ${index === questionIndex ? "current" : ""}"><span class="objective-status">${objectiveStatus.startsWith("Answered") ? "✓" : index === questionIndex ? "→" : "○"}</span><span>${escapeHtml(objective.text)}</span></li>`;
        }).join("");
        const options = question.options.map((option, index) => {
          const isSelected = option.id === answer?.selectedOptionId;
          const className = isSelected ? `selected ${answer.correct ? "correct" : "wrong"}` : "";
          return `<button class="option ${className}" data-option-index="${index}" ${answer?.correct ? "disabled" : ""}><span class="key">${index + 1}</span><span>${escapeHtml(option.text)}</span></button>`;
        }).join("");
        const feedback = selected ? `
          <div class="feedback ${answer.correct ? "correct" : "wrong"}" tabindex="-1" role="status">
            <strong>${answer.correct ? "Correct" : "Not yet"}</strong> — ${escapeHtml(selected.feedback)}
            <div class="expected"><strong>Expected answer:</strong> ${escapeHtml(question.expectedAnswer)}</div>
            ${question.sources.length ? `<div class="source-links" aria-label="Related source files"><strong>Review the sources</strong>${question.sources.map(item => `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.path)}</a>`).join("")}</div>` : ""}
          </div>
          ${!answer.correct ? `<div class="question-actions"><button class="button" id="retry" type="button">Retry</button><button class="button" id="continue" type="button">Continue anyway</button></div>` : ""}` : "";
        const canMoveForward = Boolean(answer);
        const isLast = state.stageIndex === data.stages.length - 1 && questionIndex === stage.questions.length - 1;
        app.innerHTML = `
          <div class="shell">
            <aside>
              <div class="eyebrow">Source change</div>
              ${projectMarkup}
              <div class="source-title">${escapeHtml(source.title)}</div>
              ${source.url ? `<a class="source-link" href="${escapeHtml(source.url)}">${source.mode === "github" ? "Open GitHub PR" : "Open source"}</a>` : ""}
              <div class="progress-track" aria-hidden="true"><div class="progress-bar" style="width:${progress}%"></div></div>
              <div class="progress-copy">${complete} of ${total} answered · ${progress}%</div>
              <nav class="stage-nav" id="stage-nav" aria-label="Learning sections">${stageButtons}</nav>
            </aside>
            <main>
              ${state.stageIndex === 0 ? notice("problem") : ""}
              <header class="section-head"><div class="eyebrow">Section ${state.stageIndex + 1} of ${data.stages.length} · ${escapeHtml(stage.kind)}</div><h1 tabindex="-1">${escapeHtml(stage.title)}</h1><div class="section-meta">${stage.questions.length} objectives · Direct navigation is always available</div></header>
              <section class="objectives card" aria-labelledby="objectives-title"><h2 id="objectives-title">Objectives</h2><ol class="objective-list">${objectives}</ol></section>
              <section class="question card" aria-labelledby="question-title">
                <div class="question-top"><span>Question ${questionIndex + 1} of ${stage.questions.length}</span><span>${escapeHtml(status(question))}</span></div>
                <h2 id="question-title">${escapeHtml(question.prompt)}</h2>
                <div class="options">${options}</div>
                ${feedback}
                ${isLast && complete === total ? `<div class="completion"><strong>Path complete.</strong> You can retry any question or reset all progress.</div>` : ""}
              </section>
              <div class="pager">
                <button class="button" id="previous" type="button" ${state.stageIndex === 0 && questionIndex === 0 ? "disabled" : ""}>Previous</button>
                <button class="button primary" id="next" type="button" ${!canMoveForward || isLast ? "disabled" : ""}>Next</button>
              </div>
              ${state.stageIndex === data.stages.length - 1 ? notice("impact") : ""}
            </main>
          </div>`;
        document.querySelectorAll("[data-stage-index]").forEach(button => button.addEventListener("click", () => {
          state.stageIndex = Number(button.dataset.stageIndex); save(); render();
        }));
        document.querySelectorAll("[data-option-index]").forEach(button => button.addEventListener("click", () => selectOption(question, Number(button.dataset.optionIndex))));
        document.getElementById("retry")?.addEventListener("click", () => retry(question));
        document.getElementById("continue")?.addEventListener("click", () => moveQuestion(1, true));
        document.getElementById("previous")?.addEventListener("click", () => moveQuestion(-1));
        document.getElementById("next")?.addEventListener("click", () => moveQuestion(1));
      }

      document.getElementById("reset").addEventListener("click", () => {
        if (!window.confirm("Reset all answers for this source revision?")) return;
        storageRemove(storageKey);
        state = {stageIndex: 0, questionByStage: {}, answers: {}};
        render();
      });
      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (/^[1-4]$/.test(event.key)) {
          const button = document.querySelector(`[data-option-index="${Number(event.key) - 1}"]`);
          if (button && !button.disabled) { event.preventDefault(); button.click(); }
        }
        if (event.key === "ArrowRight") document.getElementById("next")?.click();
        if (event.key === "ArrowLeft") document.getElementById("previous")?.click();
      });
      render();
    })();
  </script>
</body>
</html>
